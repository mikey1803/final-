# FAARF real-world drift probe -- instrument definition, FROZEN v1.
#
# Part of the pre-registration docs/experiments/drift_atlas_preregistration.md.
# Do not edit this file once its pre-registration commit exists: any change is a
# new file (targets_v2.yaml) plus a new pre-registration (CLAUDE.md rules 3-4).
# Every probe record carries targets_sha256 = sha256 of this file's bytes, so each
# observation is bound to the exact instrument version that produced it.
#
# Liveness of every keyless target verified 2026-10-21 (one GET each). Terms of
# use checked the same day; summaries in docs/experiments/drift_atlas.md.
#
# expect: list of checks, all must pass for sanity.ok = true. Each check has a
#   path   dotted path; "[n]" indexes arrays; "" or "[0]" may address the root
#   type   string | number | boolean | object | array | null
#   equals exact value          contains  substring (strings only)
#   nonempty  string/array/object has length > 0
# map_paths: object paths whose KEYS are data (currency codes), collapsed to
#   "map of <merged value schema>" so adding a currency is not schema drift.
# auth: none | bearer_env | goog_header_env ; auth_env names the env var.
# model_ids: for model-list targets, where the ids live (and pagination).

instrument: faarf-drift-probe
instrument_version: 1
user_agent: "FAARF-drift-probe/1.0 (research; +https://github.com/mikey1803/final-; piomicheal17@gmail.com)"
contact_email: "piomicheal17@gmail.com"
timeout_s: 10
pause_s: 0.5
cadence: "every 6 hours (cron 17 */6 * * *, GitHub Actions)"

targets:
  # ---- live-pilot tools (URLs/args from backend/recovery/live/tools.py) ----
  - id: wikipedia
    category: encyclopedic
    live_pilot: true
    method: GET
    url: "https://en.wikipedia.org/api/rest_v1/page/summary/Python_(programming_language)"
    auth: none
    terms_url: "https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_User-Agent_Policy"
    expect:
      - {path: title, type: string, equals: "Python (programming language)"}
      - {path: extract, type: string, nonempty: true}

  - id: countriesnow
    category: encyclopedic
    live_pilot: true
    method: GET
    url: "https://countriesnow.space/api/v0.1/countries/capital/q"
    params: {country: India}
    auth: none
    terms_url: "https://countriesnow.space/"
    expect:
      - {path: error, type: boolean, equals: false}
      - {path: data.capital, type: string, equals: "New Delhi"}

  - id: open_meteo
    category: weather
    live_pilot: true
    method: GET
    url: "https://api.open-meteo.com/v1/forecast"
    params: {latitude: 22.57, longitude: 88.36, current_weather: "true"}
    auth: none
    terms_url: "https://open-meteo.com/en/terms"
    expect:
      - {path: current_weather.temperature, type: number}
      - {path: current_weather.time, type: string, nonempty: true}

  - id: wttr
    category: weather
    live_pilot: true
    method: GET
    url: "https://wttr.in/Kolkata"
    params: {format: j1}
    auth: none
    terms_url: "https://github.com/chubin/wttr.in"
    expect:
      - {path: "current_condition[0].temp_C", type: string, nonempty: true}
      - {path: weather, type: array, nonempty: true}

  - id: jsonplaceholder
    category: placeholder
    live_pilot: true
    method: GET
    url: "https://jsonplaceholder.typicode.com/todos/1"
    auth: none
    terms_url: "https://jsonplaceholder.typicode.com/"
    expect:
      - {path: id, type: number, equals: 1}
      - {path: title, type: string, nonempty: true}

  - id: dummyjson
    category: placeholder
    live_pilot: true
    method: GET
    url: "https://dummyjson.com/todos/1"
    auth: none
    terms_url: "https://dummyjson.com/docs"
    expect:
      - {path: id, type: number, equals: 1}
      - {path: todo, type: string, nonempty: true}

  # ---- search ----
  - id: duckduckgo
    category: search
    method: GET
    url: "https://api.duckduckgo.com/"
    params: {q: python, format: json, no_html: "1"}
    auth: none
    terms_url: "https://duckduckgo.com/api"
    expect:
      - {path: Heading, type: string, equals: "Python"}

  - id: openlibrary
    category: search
    method: GET
    url: "https://openlibrary.org/search.json"
    params: {q: dune, limit: "1"}
    auth: none
    terms_url: "https://openlibrary.org/developers/api"
    expect:
      - {path: numFound, type: number}
      - {path: docs, type: array, nonempty: true}

  - id: crossref
    category: search
    method: GET
    url: "https://api.crossref.org/works"
    params: {query: bandit, rows: "1", mailto: "{contact_email}"}
    auth: none
    terms_url: "https://www.crossref.org/documentation/retrieve-metadata/rest-api/access-and-authentication/"
    expect:
      - {path: status, type: string, equals: "ok"}
      - {path: message.items, type: array, nonempty: true}

  - id: wikidata
    category: search
    method: GET
    url: "https://www.wikidata.org/w/api.php"
    params: {action: wbsearchentities, search: Paris, language: en, format: json, limit: "1"}
    auth: none
    terms_url: "https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_User-Agent_Policy"
    expect:
      - {path: "search[0].id", type: string, equals: "Q90"}

  # ---- weather ----
  - id: nws
    category: weather
    method: GET
    url: "https://api.weather.gov/points/39.7456,-97.0892"
    auth: none
    terms_url: "https://www.weather.gov/documentation/services-web-api"
    expect:
      - {path: properties.forecast, type: string, contains: "api.weather.gov/gridpoints/"}

  - id: met_norway
    category: weather
    method: GET
    url: "https://api.met.no/weatherapi/locationforecast/2.0/compact"
    params: {lat: "59.91", lon: "10.75"}
    auth: none
    terms_url: "https://api.met.no/doc/TermsOfService"
    expect:
      - {path: properties.timeseries, type: array, nonempty: true}

  - id: 7timer
    category: weather
    method: GET
    url: "https://www.7timer.info/bin/api.pl"
    params: {lon: "76.96", lat: "11.02", product: civil, output: json}
    auth: none
    terms_url: "https://www.7timer.info/doc.php"
    expect:
      - {path: product, type: string, equals: "civil"}
      - {path: dataseries, type: array, nonempty: true}

  # ---- geo ----
  - id: zippopotam
    category: geo
    method: GET
    url: "https://api.zippopotam.us/us/90210"
    auth: none
    terms_url: "https://www.zippopotam.us/"
    expect:
      - {path: "places[0].place name", type: string, equals: "Beverly Hills"}

  - id: usgs_quakes
    category: geo
    method: GET
    url: "https://earthquake.usgs.gov/fdsnws/event/1/query"
    params: {format: geojson, limit: "1"}
    auth: none
    terms_url: "https://earthquake.usgs.gov/fdsnws/event/1/"
    expect:
      - {path: type, type: string, equals: "FeatureCollection"}
      - {path: features, type: array}

  - id: postcodes_io
    category: geo
    method: GET
    url: "https://api.postcodes.io/postcodes/SW1A1AA"
    auth: none
    terms_url: "https://postcodes.io/"
    expect:
      - {path: status, type: number, equals: 200}
      - {path: result.postcode, type: string, equals: "SW1A 1AA"}

  # ---- finance ----
  - id: frankfurter_v1
    category: finance
    note: "deprecated endpoint watch: v1 sends Deprecation: @1779103800 (2026-05-18) and successor-version Link to /v2/rates (observed 2026-10-21)"
    method: GET
    url: "https://api.frankfurter.dev/v1/latest"
    params: {from: EUR}
    auth: none
    terms_url: "https://frankfurter.dev/"
    map_paths: [rates]
    expect:
      - {path: base, type: string, equals: "EUR"}
      - {path: rates.USD, type: number}

  - id: frankfurter_v2
    category: finance
    method: GET
    url: "https://api.frankfurter.dev/v2/rates"
    params: {base: EUR}
    auth: none
    terms_url: "https://frankfurter.dev/"
    expect:
      - {path: "[0].base", type: string, equals: "EUR"}
      - {path: "[0].rate", type: number}

  - id: er_api
    category: finance
    method: GET
    url: "https://open.er-api.com/v6/latest/USD"
    auth: none
    terms_url: "https://www.exchangerate-api.com/docs/free"
    map_paths: [rates]
    expect:
      - {path: result, type: string, equals: "success"}
      - {path: rates.EUR, type: number}

  - id: coinbase_rates
    category: finance
    method: GET
    url: "https://api.coinbase.com/v2/exchange-rates"
    params: {currency: USD}
    auth: none
    terms_url: "https://docs.cdp.coinbase.com/coinbase-app/track-apis/exchange-rates"
    map_paths: [data.rates]
    expect:
      - {path: data.currency, type: string, equals: "USD"}
      - {path: data.rates.EUR, type: string, nonempty: true}

  # ---- placeholder / negative control ----
  - id: httpbin_json
    category: placeholder
    note: "negative control: a static document that should never drift"
    method: GET
    url: "https://httpbin.org/json"
    auth: none
    terms_url: "https://httpbin.org/"
    expect:
      - {path: slideshow.title, type: string, equals: "Sample Slide Show"}

  # ---- LLM model lists ----
  - id: groq_models
    category: llm_models
    method: GET
    url: "https://api.groq.com/openai/v1/models"
    auth: bearer_env
    auth_env: GROQ_API_KEY
    terms_url: "https://console.groq.com/docs/models"
    model_ids: {path: data, id_field: id}
    expect:
      - {path: data, type: array, nonempty: true}

  - id: gemini_models
    category: llm_models
    method: GET
    url: "https://generativelanguage.googleapis.com/v1beta/models"
    params: {pageSize: "1000"}
    auth: goog_header_env
    auth_env: GOOGLE_API_KEY
    terms_url: "https://ai.google.dev/gemini-api/terms"
    model_ids: {path: models, id_field: name, next_page_token: nextPageToken, max_pages: 5}
    expect:
      - {path: models, type: array, nonempty: true}

  - id: nvidia_nim_models
    category: llm_models
    note: "public without a key (verified 2026-10-21), probed keyless so the list is not account-dependent"
    method: GET
    url: "https://integrate.api.nvidia.com/v1/models"
    auth: none
    terms_url: "https://build.nvidia.com/"
    model_ids: {path: data, id_field: id}
    expect:
      - {path: data, type: array, nonempty: true}
