# Real-world drift probe (Task 25, contribution C3).
# Instrument: docs/experiments/drift_atlas_preregistration.md + probe/targets.yaml (FROZEN v1).
# Collected data is committed ONLY to the `data` branch, never to master.
name: drift-probe

on:
  schedule:
    - cron: "17 */6 * * *"   # 00:17, 06:17, 12:17, 18:17 UTC (off the hour: less Actions queueing)
  workflow_dispatch: {}

permissions:
  contents: write            # push to the `data` branch

concurrency:
  group: drift-probe
  cancel-in-progress: false  # never interrupt a run; queue the next one

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out instrument (default branch)
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # this checkout never pushes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: probe/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r probe/requirements.txt

      - name: Check out data branch (create it as an orphan on the first run)
        uses: actions/checkout@v4
        with:
          path: databranch

      - name: Switch to data branch
        working-directory: databranch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin +refs/heads/data:refs/remotes/origin/data
            git switch -c data origin/data
          else
            git switch --orphan data
            printf '%s\n' "# Drift atlas data (Task 25, C3)" "" \
              "Written only by .github/workflows/drift-probe.yml on the default branch." \
              "Instrument and record format: docs/experiments/drift_atlas_preregistration.md (default branch)." \
              "One JSON line per target per run in probe/data/YYYY-MM-DD.jsonl (UTC)." \
              "Canonical schemas, content-addressed: probe/data/schemas/<hash>.json." > README.md
          fi

      - name: Run probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python probe/run_probe.py --out-dir databranch/probe/data | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Stage data and guard against secret leaks
        working-directory: databranch
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          git add -- probe/data
          [ -f README.md ] && git add -- README.md
          git diff --cached --name-only > "$RUNNER_TEMP/staged.txt"
          while IFS= read -r f; do
            for v in "$GROQ_API_KEY" "$GOOGLE_API_KEY"; do
              if [ -n "$v" ] && grep -qF -- "$v" "$f"; then
                echo "::error::a secret value was found in a staged file ($f); refusing to commit"
                exit 1
              fi
            done
          done < "$RUNNER_TEMP/staged.txt"
          echo "staged $(wc -l < "$RUNNER_TEMP/staged.txt") file(s); no secret values found"

      - name: Commit and push to data branch
        working-directory: databranch
        run: |
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "probe: run $(date -u +%Y%m%dT%H%M%SZ)"
          git push origin data
